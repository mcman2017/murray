# Murray, the app: FastAPI + SQLite. Holds the API key; one replica, because SQLite wants one writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murray
  namespace: ${MURRAY_NAMESPACE}
  labels: { app.kubernetes.io/name: murray, app.kubernetes.io/component: app, app.kubernetes.io/part-of: murray }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy: { type: Recreate }       # the volume is ReadWriteOnce and SQLite wants one writer
  selector:
    matchLabels: { app.kubernetes.io/name: murray, app.kubernetes.io/component: app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: murray, app.kubernetes.io/component: app, app.kubernetes.io/part-of: murray }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: ${PULL_SECRET} }]
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 14101
        runAsGroup: 14101
        fsGroup: 14101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: murray
          image: ${MURRAY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: MURRAY_ROLE, value: app }
            - { name: MURRAY_DATA_DIR, value: /data }
            - { name: MURRAY_SANDBOX_URL, value: "http://murray-sandbox:8100" }
            - { name: MURRAY_AUTOSTART, value: "${MURRAY_AUTOSTART}" }
            - { name: OPENBLAS_NUM_THREADS, value: "2" }
            - { name: OMP_NUM_THREADS, value: "2" }
            - name: MURRAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: murray-admin, key: MURRAY_ADMIN_TOKEN } }
          envFrom:
            # GEMINI_API_KEY and, with several keys, GEMINI_API_KEY_1, _2, ... (see scripts/set-gemini-keys.sh)
            - secretRef: { name: murray-gemini }
            - configMapRef: { name: murray-config, optional: true }
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "2", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: murray-data }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: murray
  namespace: ${MURRAY_NAMESPACE}
  labels: { app.kubernetes.io/name: murray, app.kubernetes.io/component: app, app.kubernetes.io/part-of: murray }
spec:
  selector: { app.kubernetes.io/name: murray, app.kubernetes.io/component: app }
  ports:
    - { name: http, port: 80, targetPort: http }
